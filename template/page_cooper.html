<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:1080px;overflow:hidden;background:#0A0A0A;font-family:Inter,'Noto Color Emoji',sans-serif;color:#fff}
#env,#fx,#stage,#ov{position:absolute;inset:0}
.title{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:72px;font-weight:800;line-height:1.05;color:#BDBDBD}
.title em{font-style:normal;color:#fff;text-shadow:0 0 22px rgba(255,255,255,.55)}
.cardwrap{position:absolute;left:0;right:0;top:880px;display:flex;justify-content:center}
.card{position:absolute;background:#1A1A1A;border:3px solid #333;border-radius:30px;padding:18px 32px;display:flex;align-items:center;gap:20px;max-width:1200px}
.card .ic{font-size:56px;line-height:1}
.card .h{font-size:44px;font-weight:800;color:#fff;line-height:1.12;white-space:nowrap}
.card .s{font-size:28px;color:#A9A9A9;margin-top:4px;white-space:nowrap}
.hl{border-color:#fff;background:#222}
.bad{border:3px dashed #BDBDBD;background:#262626}
.warn{border-color:#8A8A8A;background:#1E1E1E}
.hook{position:absolute;left:0;right:0;top:36px;display:flex;justify-content:center}
.hook div{background:#fff;color:#000;font-size:64px;font-weight:900;padding:14px 40px;border-radius:24px;box-shadow:0 0 50px rgba(255,255,255,.45);letter-spacing:1px}
</style></head>
<body>
<svg id="env" width="1440" height="1080" viewBox="0 0 1440 1080"></svg>
<svg id="fx" width="1440" height="1080" viewBox="0 0 1440 1080"></svg>
<div id="stage"></div>
<svg id="ov" width="1440" height="1080" viewBox="0 0 1440 1080"></svg>
<script>window.T={DUR:[9.6667,13.4333,11.5,10.2667,11.9333,10.7],CUE:{s1_salta:4.1,s1_ninguem:7.0,s2_ticket:7.3,s2_cabin:8.6,s2_note:10.0,s2_whisper:12.2,s3_exige:3.14,s3_seattle:6.66,s3_mexico:9.54,s4_abre:3.2,s4_salta:5.48,s4_pousa:6.5,s5_acha:3.69,s5_excited:6.4,s5_sumiu:8.0,s6_gravata:2.48,s6_upbeat:4.32,s6_segue:7.4}};</script>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function vis(lt,a,b=1e9,tin=.45,tout=.35){if(lt<a||lt>=b+tout)return 0;return lt<b?ease(seg(lt,a,a+tin)):1-ease(seg(lt,b,b+tout))}
const FY=820, CX=720;

// ===== timing (filled from the narration analysis) =====
window.T = window.T || {DUR:[7,14,12,9,16,9], CUE:{}};
const DUR=T.DUR;
const START=[];{let s=0;for(const d of DUR){START.push(s);s+=d}}
const TOTAL=DUR.reduce((a,b)=>a+b,0);
const C=(k,def)=> (T.CUE[k]!==undefined?T.CUE[k]:def);
const TONES=()=>[
 [[0,'tense']],
 [[0,'normal'],[C('s2_whisper',11.0),'tense']],
 [[0,'normal']],
 [[0,'tense'],[C('s4_pousa',5.4),'normal']],
 [[0,'tense'],[C('s5_excited',5.6),'excited'],[C('s5_sumiu',7.6),'sad']],
 [[0,'normal'],[C('s6_upbeat',4.2),'excited']],
];
function toneAt(si,lt){const L=TONES()[si];let v=L[0][1],t0=0;for(const [t,x] of L) if(lt>=t){v=x;t0=t}return [v,t0]}

// ===== cards =====
let CUR_SI=0;
function cards(lt,list){
  let cur=-1;list.forEach((c,i)=>{if(lt>=c.at)cur=i});
  let h='';
  [cur-1,cur].forEach(i=>{if(i<0)return;const c=list[i];let e,y=0,sc=1;
    if(i===cur){const [tone]=toneAt(CUR_SI,c.at);const p=seg(lt,c.at,c.at+(tone==='excited'?.3:.45));e=ease(p);sc=tone==='excited'?back(p):.95+.05*e;y=(1-e)*40}
    else{const p=seg(lt,list[cur].at,list[cur].at+.3);e=1-p;y=-p*40;if(e<=0)return}
    let tx=0;if(c.shake&&i===cur){const k=lt-c.at;if(k<.7)tx=Math.sin(k*55)*14*(1-k/.7)}
    let st='';if(c.cls&&c.cls.includes('hl')){const q=.5+.5*Math.sin(lt*4);st=`box-shadow:0 0 ${18+22*q}px rgba(255,255,255,.35);`}
    const num=c.num?`<div class="h" style="font-size:56px">${typeof c.num==='function'?c.num(lt):c.num}</div>`:'';
    h+=`<div class="card ${c.cls||''}" style="opacity:${e};transform:translate(${tx}px,${y}px) scale(${sc});${st}">${c.ic?`<div class="ic">${c.ic}</div>`:''}<div>${c.h?`<div class="h">${c.h}</div>`:''}${num}${c.s?`<div class="s">${c.s}</div>`:''}</div></div>`});
  return h;
}

// ===== defs/helpers =====
const DEFS=`<defs>
 <filter id="gN" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="gB" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="gD" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="gLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F4F4"/><stop offset="1" stop-color="#A9A9A9"/></linearGradient>
 <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E8E8E"/><stop offset="1" stop-color="#4E4E4E"/></linearGradient>
 <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A3A"/><stop offset="1" stop-color="#1E1E1E"/></linearGradient>
 <linearGradient id="gBld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2C2C"/><stop offset="1" stop-color="#1A1A1A"/></linearGradient>
 <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A5A5A"/><stop offset="1" stop-color="#2A2A2A"/></linearGradient>
 <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#0E0E0E"/></linearGradient>
 <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070707"/><stop offset="1" stop-color="#1C1C1C"/></linearGradient>
 <linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2E2E"/><stop offset="1" stop-color="#1A1A1A"/></linearGradient>
 <linearGradient id="gSoil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A2A"/><stop offset="1" stop-color="#141414"/></linearGradient>
 <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D2D2D2"/></linearGradient>
 <radialGradient id="gVig" cx=".5" cy=".45" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="1"/></radialGradient>
 <radialGradient id="gLamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <radialGradient id="gHole" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#5A5A5A" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity="1"/></radialGradient>
</defs>`;
const shadow=(x,w,o=.5,y=FY)=>`<ellipse cx="${x}" cy="${y+4}" rx="${w/2}" ry="${Math.max(6,w*.07)}" fill="#000" opacity="${o}" filter="url(#soft)"/>`;
function txt(x,y,s,size=40,col='#fff',w=900,anchor='middle',extra=''){return `<text x="${x}" y="${y}" fill="${col}" font-size="${size}" font-weight="${w}" text-anchor="${anchor}" ${extra}>${s}</text>`}
function coinFace(x,y,r,rot){const sx=Math.abs(Math.cos(rot));return `<g transform="translate(${x} ${y}) scale(${Math.max(.12,sx)} 1)"><circle r="${r}" fill="url(#gLight)"/><circle r="${r*.74}" fill="#D6D6D6"/><text y="${r*.32}" font-size="${r*.9}" font-weight="900" text-anchor="middle" fill="#6A6A6A">$</text></g>`}
function note(x,y,rot,s=1,lab='50'){return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><rect x="-60" y="-30" width="120" height="60" rx="8" fill="url(#gLight)"/><rect x="-50" y="-21" width="100" height="42" rx="6" fill="none" stroke="#9A9A9A" stroke-width="3"/>${txt(0,10,'R$'+lab,22,'#3A3A3A',900)}</g>`}
function sack(x,y,s=1,lab='$'){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-46 0 Q-56 -60 -20 -78 L-14 -92 Q0 -100 14 -92 L20 -78 Q56 -60 46 0 Z" fill="url(#gLight)"/><rect x="-18" y="-96" width="36" height="12" rx="6" fill="#6A6A6A"/>${txt(0,-28,lab,38,'#5A5A5A',900)}</g>`}
function bigCounter(x,y,val,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-330" y="-62" width="660" height="124" rx="26" fill="#111" stroke="#fff" stroke-width="5" filter="url(#gD)"/>${txt(0,26,val,72,'#fff',900)}</g>`}

// ===== full-body characters (all white, varied) =====
const COLS={dim:'#9E9E9E',normal:'#F0F0F0',bright:'#FFFFFF'};
const FIL={dim:'gD',normal:'gN',bright:'gB'};
function person(o){
  // feet at (o.x,o.y). Local units: total height ~430.
  const t=o.t||0,tone=o.tone||'normal',npc=!!o.npc;
  const state=npc?'normal':({sad:'dim',tense:'normal',excited:'bright',normal:'normal'})[tone];
  const c=npc?(o.c||'#E6E6E6'):COLS[state];const fil=npc?'gD':FIL[state];
  const sx=o.w||1, sy=o.h||1, s=o.s||.8, fx=o.flip?-1:1;
  const acc=o.acc||[];
  let pose=o.pose||'stand';if(!npc&&tone==='sad'&&!o.keepPose)pose='sad';
  let AL=100,AR=80,LL=96,LR=84,lean=0,headDY=0,bob=0,armLen=128;
  const w=Math.sin(t*(o.speed||8));
  switch(pose){
    case 'walk':LL=90+20*w;LR=90-20*w;AL=90-22*w;AR=90+22*w;bob=Math.abs(w)*-6;break;
    case 'run':LL=90+38*w;LR=90-38*w;AL=90-50*w;AR=90+50*w;lean=8;bob=Math.abs(w)*-12;break;
    case 'sneak':LL=90+14*w;LR=90-14*w;AL=120;AR=60;lean=12;bob=Math.abs(w)*-4;break;
    case 'dig':{const k=Math.sin(t*6);AL=55+25*k;AR=70+25*k;lean=10+6*k;LL=100;LR=80;break}
    case 'carry':AL=105;AR=-70;break;
    case 'carry2':AL=40;AR=140;armLen=110;break;
    case 'point':AR=-25+3*Math.sin(t*3);break;
    case 'scared':AL=-125+6*Math.sin(t*30);AR=-55-6*Math.sin(t*30);armLen=110;break;
    case 'cheer':AL=-125+12*Math.sin(t*9);AR=-55-12*Math.sin(t*9);break;
    case 'give':AR=5+4*Math.sin(t*4);break;
    case 'hold':AR=20;break;
    case 'phone':AR=-110;armLen=100;break;
    case 'type':AL=50;AR=130;armLen=95;break;
    case 'think':AR=-120;armLen=95;break;
    case 'shrug':AL=150;AR=30;armLen=100;break;
    case 'gavel':AR=-60+50*Math.max(0,Math.sin(t*5));break;
    case 'sad':AL=95;AR=85;headDY=14;lean=4;break;
    case 'cane':AR=70;lean=6;break;
    case 'wave':AR=-80+25*Math.sin(t*8);break;
    default:AL=100+2*Math.sin(t*2);AR=80-2*Math.sin(t*2.3);
  }
  if(!npc&&tone==='excited'&&pose!=='cheer')AR+=6*Math.sin(t*12);
  let hop=0;if(!npc&&tone==='excited'&&o.hop!==false)hop=-Math.abs(Math.sin(t*6))*12;
  const shake=(!npc&&tone==='tense')?Math.sin(t*45)*2:0;
  const rad=a=>a*Math.PI/180;headDY+=3*Math.sin(t*2.1+1);const idleR=1.8*Math.sin(t*1.7+(o.x||0)*.01);const breath=1+.015*Math.sin(t*2.4);
  const limb=(x0,y0,a,L)=>[x0+L*Math.cos(rad(a)),y0+L*Math.sin(rad(a))];
  const hipY=-170,shY=-292;
  const [lfx,lfy]=limb(-26,hipY,LL,170),[rfx,rfy]=limb(26,hipY,LR,170);
  const [lhx,lhy]=limb(-70,shY,AL,armLen),[rhx,rhy]=limb(70,shY,AR,armLen);
  const tr=`translate(${o.x+shake} ${o.y+hop+bob+(o.dy||0)}) rotate(${(o.rot||0)+lean*fx+idleR}) scale(${fx*s*sx} ${s*sy*breath})`;
  const D='#1C1C1C',G='#4A4A4A';
  const isW=acc.includes('woman');
  let backL='',front='';
  if(acc.includes('longhair'))backL+=`<path d="M-54 ${-372+headDY} Q-62 ${-290} -46 ${-262} L46 -262 Q62 ${-290} 54 ${-372+headDY} Z" fill="${c}"/>`;
  if(acc.includes('pony'))backL+=`<path d="M36 ${-392+headDY} q50 6 42 74 q-16 -26 -40 -40z" fill="${c}"/>`;
  // body
  let body=`<line x1="-26" y1="${hipY}" x2="${lfx}" y2="${lfy}" stroke="${c}" stroke-width="34" stroke-linecap="round"/><line x1="26" y1="${hipY}" x2="${rfx}" y2="${rfy}" stroke="${c}" stroke-width="34" stroke-linecap="round"/>
   <ellipse cx="${lfx-8}" cy="${lfy+2}" rx="24" ry="11" fill="${c}"/><ellipse cx="${rfx+8}" cy="${rfy+2}" rx="24" ry="11" fill="${c}"/>`;
  body+=isW?`<path d="M-56 -306 Q0 -322 56 -306 L66 -200 L92 -138 L-92 -138 L-66 -200 Z" fill="${c}"/>`:`<rect x="-64" y="-312" width="128" height="160" rx="44" fill="${c}"/>`;
  body+=`<circle cx="0" cy="${-366+headDY}" r="50" fill="${c}"/>`;
  body+=`<line x1="-70" y1="${shY}" x2="${lhx}" y2="${lhy}" stroke="${c}" stroke-width="28" stroke-linecap="round"/><line x1="70" y1="${shY}" x2="${rhx}" y2="${rhy}" stroke="${c}" stroke-width="28" stroke-linecap="round"/>`;
  const hy=-366+headDY;
  if(acc.includes('beanie'))front+=`<path d="M-52 ${hy-6} Q-52 ${hy-66} 0 ${hy-68} Q52 ${hy-66} 52 ${hy-6} Z" fill="${D}"/><rect x="-54" y="${hy-14}" width="108" height="16" rx="6" fill="#3A3A3A"/>`;
  if(acc.includes('cap'))front+=`<path d="M-50 ${hy-10} Q0 ${hy-80} 50 ${hy-10} Z" fill="${D}"/><rect x="18" y="${hy-20}" width="60" height="12" rx="6" fill="${D}"/>`;
  if(acc.includes('hood'))backL=`<path d="M-72 ${hy+40} Q-80 ${hy-80} 0 ${hy-82} Q80 ${hy-80} 72 ${hy+40} Z" fill="#3A3A3A"/>`+backL;
  if(acc.includes('bun'))front+=`<circle cx="0" cy="${hy-56}" r="24" fill="${c}"/>`;
  if(acc.includes('glasses'))front+=`<g fill="none" stroke="${D}" stroke-width="6"><circle cx="-19" cy="${hy+4}" r="13"/><circle cx="19" cy="${hy+4}" r="13"/><line x1="-6" y1="${hy+4}" x2="6" y2="${hy+4}"/></g>`;
  if(acc.includes('mask'))front+=`<rect x="-46" y="${hy-12}" width="92" height="24" rx="10" fill="${D}"/><circle cx="-18" cy="${hy}" r="7" fill="#fff"/><circle cx="18" cy="${hy}" r="7" fill="#fff"/>`;
  if(acc.includes('tie'))front+=`<polygon points="-12,-306 12,-306 8,-286 18,-220 0,-204 -18,-220 -8,-286" fill="${D}"/>`;
  if(acc.includes('suit'))front+=`<path d="M-64 -300 L-10 -300 L-30 -160 L-64 -160 Z M64 -300 L10 -300 L30 -160 L64 -160 Z" fill="#3A3A3A" opacity=".85"/>`;
  if(acc.includes('badge'))front+=`<rect x="20" y="-276" width="30" height="40" rx="5" fill="${G}"/><rect x="24" y="-270" width="22" height="12" rx="3" fill="#BDBDBD"/>`;
  if(acc.includes('lanyard'))front+=`<path d="M-30 -306 L0 -250 L30 -306" fill="none" stroke="${G}" stroke-width="5"/><rect x="-16" y="-252" width="32" height="40" rx="5" fill="#BDBDBD"/>`;
  if(acc.includes('police'))front+=`<rect x="-56" y="${hy-46}" width="112" height="18" rx="7" fill="${D}"/><path d="M-48 ${hy-46} Q0 ${hy-110} 48 ${hy-46} Z" fill="${D}"/><circle cx="0" cy="${hy-66}" r="10" fill="#BDBDBD"/><polygon points="-52,-282 -38,-290 -24,-282 -27,-262 -38,-254 -49,-262" fill="#9A9A9A"/>`;
  if(acc.includes('guard'))front+=`<path d="M-50 ${hy-14} Q0 ${hy-74} 50 ${hy-14} Z" fill="${D}"/><rect x="-54" y="${hy-20}" width="108" height="12" rx="6" fill="${D}"/>${txt(0,-226,'SEG',22,'#3A3A3A',900)}`;
  if(acc.includes('robe'))front+=`<path d="M-66 -306 L66 -306 L86 -20 L-86 -20 Z" fill="#2A2A2A"/><rect x="-14" y="-306" width="28" height="30" fill="#E6E6E6"/>`;
  if(acc.includes('shades'))front+=`<rect x="-40" y="${hy-6}" width="34" height="18" rx="7" fill="${D}"/><rect x="6" y="${hy-6}" width="34" height="18" rx="7" fill="${D}"/><rect x="-8" y="${hy-2}" width="16" height="5" fill="${D}"/>`;
  if(acc.includes('chute'))backL+=`<rect x="-74" y="-300" width="60" height="130" rx="18" fill="#5A5A5A"/>`;
  if(acc.includes('backpack'))backL+=`<rect x="-80" y="-292" width="48" height="110" rx="16" fill="#3A3A3A"/>`;
  let h=o.noShadow?'':shadow(o.x,140*s*sx,.5,o.y+(o.dy||0));
  h+=`<g transform="${tr}"><g filter="url(#${fil})">${backL}${body}</g>${front}`;
  // props in right hand
  const pr=o.prop;
  if(pr){const hx=rhx,hy2=rhy;let p='';
    if(pr==='shovel')p=`<g transform="translate(${hx} ${hy2}) rotate(${-AR+90})"><rect x="-6" y="-60" width="12" height="200" rx="5" fill="#8A8A8A"/><path d="M-28 130 L28 130 L20 190 Q0 210 -20 190 Z" fill="#BDBDBD"/></g>`;
    if(pr==='sack')p=sack(hx,hy2+40,1.0);
    if(pr==='flash')p=`<g transform="translate(${hx} ${hy2}) rotate(${-AR+90-80})"><rect x="-10" y="-40" width="20" height="60" rx="6" fill="#5A5A5A"/></g><polygon points="${hx+10},${hy2-10} ${hx+260},${hy2-90} ${hx+260},${hy2+70}" fill="#fff" opacity=".12"/>`;
    if(pr==='phone')p=`<g transform="translate(${hx} ${hy2-10})"><rect x="-18" y="-32" width="36" height="64" rx="8" fill="#2A2A2A"/><rect x="-13" y="-26" width="26" height="50" rx="4" fill="#fff" filter="url(#gD)"/></g>`;
    if(pr==='envelope')p=`<g transform="translate(${hx+14} ${hy2})"><rect x="-38" y="-26" width="76" height="52" rx="6" fill="url(#gLight)"/><path d="M-38 -26 L0 4 L38 -26" fill="none" stroke="#8A8A8A" stroke-width="4"/>${txt(0,22,'$',22,'#5A5A5A',900)}</g>`;
    if(pr==='key')p=`<g transform="translate(${hx+16} ${hy2})"><rect x="-44" y="-28" width="88" height="56" rx="8" fill="#fff" filter="url(#gD)"/>${txt(0,8,'SENHAS',18,'#000',900)}</g>`;
    if(pr==='gavel')p=`<g transform="translate(${hx} ${hy2}) rotate(-30)"><rect x="-5" y="-10" width="10" height="70" fill="#8A8A8A"/><rect x="-26" y="-30" width="52" height="24" rx="6" fill="#BDBDBD"/></g>`;
    if(pr==='cane')p=`<rect x="${hx-5}" y="${hy2}" width="10" height="${-hy2}" rx="5" fill="#6A6A6A"/>`;
    if(pr==='bag')p=`<g transform="translate(${hx} ${hy2+30})"><rect x="-26" y="-20" width="52" height="56" rx="10" fill="#5A5A5A"/><path d="M-14 -20 Q0 -44 14 -20" fill="none" stroke="#5A5A5A" stroke-width="6"/></g>`;
    if(pr==='briefcase')p=`<g transform="translate(${hx} ${hy2+40})"><rect x="-40" y="-26" width="80" height="56" rx="8" fill="#3A3A3A"/><rect x="-14" y="-36" width="28" height="12" rx="5" fill="none" stroke="#3A3A3A" stroke-width="6"/></g>`;
    if(pr==='ball')p=`<circle cx="${hx}" cy="${hy2+36}" r="26" fill="#BDBDBD"/>`;

// ===== render =====
window.render=function(si,lt){
  CUR_SI=si;const sc=SC[si],gt=START[si]+lt;
  const fin=si===0?1:ease(lt/0.35),fout=si===5?1:1-ease((lt-(DUR[si]-0.25))/0.25);const o=Math.min(fin,fout);
  const [tone,t0]=toneAt(si,lt);
  let zoom=1+0.03*(lt/DUR[si]);if(tone==='excited')zoom+=0.02*ease(seg(lt,t0,t0+.6));
  const shake=tone==='tense'?Math.sin(lt*50)*3*Math.max(.25,1-seg(lt,t0,t0+1)):0;
  const slide=si===0?0:(1-ease(lt/0.4))*60;
  let top='';
  if(sc.hook&&lt<3.4){const p=back(seg(lt,0.05,0.4));const out=1-ease(seg(lt,3.0,3.4));top=`<div class="hook" style="opacity:${out};transform:scale(${p})"><div>${sc.hook}</div></div>`}
  else if(sc.title)top=`<div class="title" style="transform:translateY(${-slide*.5}px)">${sc.title}</div>`;
  document.getElementById('stage').innerHTML=`<div style="opacity:${o}">${top}<div class="cardwrap">${cards(lt,sc.cards())}</div></div>`;
  document.getElementById('env').innerHTML=DEFS+`<g opacity="${o}" transform="translate(${slide+shake+12*Math.sin(gt*.35)} ${7*Math.sin(gt*.27)}) translate(${CX} ${FY}) scale(${zoom}) translate(${-CX} ${-FY})">${sc.env(lt,gt)}</g>`;
  let fx='';
  if(tone==='sad')fx+=`<rect x="0" y="0" width="1440" height="1080" fill="url(#gVig)" opacity="${.5*ease(seg(lt,t0,t0+.8))}"/>`;
  if(tone==='tense'){if(t0>0){const f=1-seg(lt,t0,t0+.25);if(f>0)fx+=`<rect x="0" y="0" width="1440" height="1080" fill="#fff" opacity="${.25*f}"/>`}fx+=`<rect x="0" y="0" width="1440" height="1080" fill="url(#gVig)" opacity=".35"/>`}
  if(tone==='excited'&&lt-t0<.2&&t0>0)fx+=`<rect x="0" y="0" width="1440" height="1080" fill="#fff" opacity="${.15*(1-(lt-t0)/.2)}"/>`;
