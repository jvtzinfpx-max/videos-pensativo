<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#050505}
svg{position:absolute;inset:0}
text{font-family:Montserrat,sans-serif}
</style></head>
<body>
<svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<script>
// ---------- utils ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const FY=780;
// appear/disappear: returns [opacity, scale]
function ap(t,a,b=1e9,din=.38,dout=.3){
  if(t<a||t>b+dout)return [0,0];
  if(t<b){const p=seg(t,a,a+din);return [ease(p*1.6),back(p)]}
  const q=seg(t,b,b+dout);return [1-q,1-.15*q];
}
const W='#FFFFFF';
const LS=`stroke="${W}" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"`;
function g(x,y,s,o,inner,extra=''){if(o<=0.001||s<=0.001)return '';return `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(4)})" opacity="${clamp(o).toFixed(3)}" ${extra}>${inner}</g>`}
function T(x,y,str,size,{w=800,col=W,ls=3,anchor='middle',op=1,filt='tg'}={}){return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" fill="${col}" letter-spacing="${ls}" text-anchor="${anchor}" opacity="${op}" ${filt?`filter="url(#${filt})"`:''}>${str}</text>`}
// line-draw path (pathLength=1)
function P(d,p=1,sw=5,extra=''){if(p<=0)return '';return `<path d="${d}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1-clamp(p)).toFixed(4)}" stroke="${W}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`}

// ---------- icons (centered at 0,0, ~100px) ----------
const I={
 house:(p=1)=>P('M-50 0 L0 -44 L50 0',p)+P('M-38 -10 L-38 44 L38 44 L38 -10',p)+P('M-10 44 L-10 16 L10 16 L10 44',p),
 phone:(p=1,inner='')=>P('M-32 -54 Q-32 -60 -26 -60 L26 -60 Q32 -60 32 -54 L32 54 Q32 60 26 60 L-26 60 Q-32 60 -32 54 Z',p)+P('M-10 -50 L10 -50',p,4)+inner,
 bank:(p=1)=>P('M-54 -18 L0 -50 L54 -18 Z',p)+P('M-38 -8 L-38 34 M-13 -8 L-13 34 M13 -8 L13 34 M38 -8 L38 34',p)+P('M-56 46 L56 46',p),
 bolt:(s=1,fill=W)=>`<path d="M4 -26 L-12 4 L0 4 L-4 26 L12 -4 L0 -4 Z" transform="scale(${s})" fill="${fill}" stroke="${W}" stroke-width="2" stroke-linejoin="round"/>`,
 gear:(r=22,rot=0,teeth=8)=>{let d='';for(let i=0;i<teeth;i++){const a=(i/teeth)*Math.PI*2;d+=`M${(Math.cos(a)*r).toFixed(1)} ${(Math.sin(a)*r).toFixed(1)} L${(Math.cos(a)*(r+9)).toFixed(1)} ${(Math.sin(a)*(r+9)).toFixed(1)} `}
   return `<g transform="rotate(${rot})"><circle r="${r}" ${LS} stroke-width="4"/><circle r="${r*.35}" ${LS} stroke-width="4"/><path d="${d}" ${LS} stroke-width="6"/></g>`},
 machine:(p=1,rot=0)=>P('M-90 50 L-90 -40 L90 -40 L90 50 Z',p)+P('M40 -40 L40 -90 L62 -90 L62 -40',p)+P('M90 0 L120 0 L120 20 L90 20',p)+
   (p>.6?`<g opacity="${seg(p,.6,1)}"><g transform="translate(-40 6)">${I.gear(24,rot)}</g><g transform="translate(14 14)">${I.gear(15,-rot*1.6,7)}</g></g>`:''),
 check:(s=1)=>`<g transform="scale(${s})"><circle r="24" fill="#050505" ${LS} stroke-width="4"/><path d="M-11 1 L-3 9 L12 -8" ${LS} stroke-width="5"/></g>`,
 x:(s=1)=>`<g transform="scale(${s})"><circle r="24" fill="#050505" ${LS} stroke-width="4"/><path d="M-9 -9 L9 9 M9 -9 L-9 9" ${LS} stroke-width="5"/></g>`,
 coin:(s=1)=>`<g transform="scale(${s})"><circle r="20" fill="#050505" ${LS} stroke-width="4"/>${T(0,9,'$',24,{w:900,ls:0,filt:''})}</g>`,
 bubbleT:(w,h,p=1)=>P(`M${-w/2+30} ${-h/2} L${w/2-30} ${-h/2} Q${w/2} ${-h/2} ${w/2} ${-h/2+30} L${w/2} ${h/2-30} Q${w/2} ${h/2} ${w/2-30} ${h/2} L${-w/2+30} ${h/2} Q${-w/2} ${h/2} ${-w/2} ${h/2-30} L${-w/2} ${-h/2+30} Q${-w/2} ${-h/2} ${-w/2+30} ${-h/2} Z`,p),
 bulb:(p=1)=>P('M-26 22 Q-50 0 -46 -30 Q-40 -70 0 -72 Q40 -70 46 -30 Q50 0 26 22 Z',p)+P('M-20 34 L20 34 M-14 46 L14 46',p)+P('M-12 10 L-6 -22 L0 -6 L6 -22 L12 10',p,4),
 eye:(o=1)=>`<path d="M-70 0 Q0 ${-56*o} 70 0 Q0 ${56*o} -70 0 Z" ${LS}/><circle r="${20*o}" fill="${W}"/>`,
 tower:(p=1)=>P('M-26 0 L-8 -150 L8 -150 L26 0 M-17 -70 L17 -70 M-12 -110 L12 -110 M-40 -130 L40 -130',p),
 plant:(p=1,rot=0)=>P('M-110 0 L-110 -120 L60 -120 L60 0',p)+P('M10 -120 L10 -190 L36 -190 L36 -120',p)+(p>.5?`<g transform="translate(-40 -60)" opacity="${seg(p,.5,1)}">${I.gear(26,rot)}</g>`:''),
 houseS:(lit=0,p=1)=>P('M-40 0 L-40 -60 L0 -92 L40 -60 L40 0',p)+`<rect x="-14" y="-52" width="28" height="24" rx="3" fill="${lit>0?W:'none'}" fill-opacity="${lit}" ${LS} stroke-width="4" opacity="${p>.7?1:0}"/>`,
 outlet:(p=1)=>P('M-110 -130 L110 -130 Q130 -130 130 -110 L130 110 Q130 130 110 130 L-110 130 Q-130 130 -130 110 L-130 -110 Q-130 -130 -110 -130 Z',p,6)+P('M0 -88 A88 88 0 1 1 -0.1 -88',p,5)+(p>.7?`<g opacity="${seg(p,.7,1)}"><circle cx="-32" cy="0" r="13" ${LS}/><circle cx="32" cy="0" r="13" ${LS}/><circle cx="0" cy="42" r="11" ${LS}/></g>`:''),
 globe:(rot=0)=>{const k=Math.sin(rot);return `<circle r="60" ${LS}/><ellipse rx="${Math.abs(26*Math.cos(rot))+4}" ry="60" ${LS} stroke-width="4"/><path d="M-60 0 L60 0 M-52 -30 L52 -30 M-52 30 L52 30" ${LS} stroke-width="4"/>`},
 doc:(s=1)=>`<g transform="scale(${s})"><path d="M-22 -30 L10 -30 L22 -18 L22 30 L-22 30 Z" fill="#050505" ${LS} stroke-width="4"/><path d="M-12 -12 L12 -12 M-12 0 L12 0 M-12 12 L4 12" ${LS} stroke-width="3"/></g>`,
 bill:(s=1)=>`<g transform="scale(${s})"><rect x="-38" y="-22" width="76" height="44" rx="5" fill="#050505" ${LS} stroke-width="4"/>${T(0,9,'−$',22,{w:900,ls:0,filt:''})}</g>`,
 shield:(p=1)=>P('M0 -70 L56 -48 Q56 30 0 70 Q-56 30 -56 -48 Z',p),
 calendar:(txt,sub='ANO')=>`<rect x="-80" y="-70" width="160" height="150" rx="18" fill="#050505" ${LS}/><path d="M-80 -24 L80 -24" ${LS} stroke-width="4"/><path d="M-40 -84 L-40 -58 M40 -84 L40 -58" ${LS} stroke-width="6"/>${T(0,-36,sub,18,{ls:4,filt:''})}${T(0,42,txt,50,{w:900,ls:1,filt:''})}`,
 wrench:()=>`<path d="M-40 40 L10 -10 M10 -10 A22 22 0 1 0 30 -34 L18 -22 L8 -26 L4 -36 L16 -48" ${LS} stroke-width="7"/>`,
 pill:(txt,{fill=false,size=22,pad=26}={})=>{const w=txt.length*size*.78+pad*2;return `<rect x="${-w/2}" y="-24" width="${w}" height="48" rx="24" fill="${fill?W:'#050505'}" stroke="${W}" stroke-width="4"/>${T(0,size*.36,txt,size,{w:800,col:fill?'#050505':W,ls:2,filt:''})}`},
 dpill:(txt,size=24)=>{const w=txt.length*size*.8+56;return `<rect x="${-w/2}" y="-26" width="${w}" height="52" rx="12" fill="#050505" stroke="${W}" stroke-width="4" stroke-dasharray="10 8"/>${T(0,size*.36,txt,size,{w:900,ls:3,filt:''})}`},
 tie:()=>`<path d="M-7 -118 L7 -118 L4 -110 L10 -76 L0 -66 L-10 -76 L-4 -110 Z" fill="#050505"/>`,
};
function label(x,y,small,big,o=1){return g(x,y,1,o,(small?T(0,0,small,15,{w:700,col:'#A8A8A8',ls:5,filt:''}):'')+T(0,small?28:0,big,20,{w:800,ls:5}))}

// ---------- character ----------
// feet at (x,y). opts: s, dim(0..1), tie, rot, bolts(0..1), ring, glowK
function person(x,y,t,o={}){
  const s=o.s||1,dim=o.dim||0,rot=o.rot||0;
  const br=o.still?0:Math.sin(t*2.2+(o.ph||0));
  const sy=1+0.012*br, hy=-2*br;
  const op=1-0.55*dim;
  const fil=dim>.5?'fD':'fP';
  let body=`<path d="M-40 0 L-40 -82 A40 40 0 0 1 40 -82 L40 0 Z" fill="${W}" transform="scale(1 ${sy})"/>`;
  let head=`<circle cx="0" cy="${-160+hy+(o.headDY||0)}" r="31" fill="${W}"/>`;
  let extra='';
  if(o.tie) extra+=I.tie();
  let inner=`<g filter="url(#${fil})">${body}${head}</g>${extra}`;
  if(o.ring){const q=o.ring;extra='';inner+=`<circle cy="${-160+hy}" r="${44}" ${LS} stroke-width="4" opacity="${q}" filter="url(#tg)"/>`}
  if(o.bolts){const n=5;for(let i=0;i<n;i++){const a=t*1.6+i*Math.PI*2/n;const bx=Math.cos(a)*78,by=-160+hy+Math.sin(a)*30;const z=Math.sin(a)>0?1:.75;
      inner+=`<g transform="translate(${bx.toFixed(1)} ${(by-6).toFixed(1)}) scale(${(.55*z*o.bolts).toFixed(3)})" opacity="${o.bolts}" filter="url(#tg)">${I.bolt(1)}</g>`}}
  if(o.dollars){const n=5;for(let i=0;i<n;i++){const a=-t*1.3+i*Math.PI*2/n;const bx=Math.cos(a)*74,by=-160+hy+Math.sin(a)*28;
      inner+=T(bx.toFixed(1),(by+9).toFixed(1),'$',30,{w:900,ls:0,op:o.dollars})}}
  const sh=`<ellipse cx="0" cy="4" rx="${48}" ry="7" fill="#fff" opacity="${.10*(1-dim)}" filter="url(#tg)"/>`;
  return `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot}) scale(${s})" opacity="${(op*(o.op===undefined?1:o.op)).toFixed(3)}">${rot===0?sh:''}${inner}</g>`;
}

// ---------- camera ----------
// keys: [t, x, y, zoom, dur]
const CAM=[
 [0,    20, 600,1.12, 0],
 [1.4,  80, 590,1.12, .9],
 [2.3, 160, 520,1.45, 1.4],
 [5.6, 420, 540,1.0, .7],
 [9.85,170, 560,1.35, .8],
 [11.55,1500,540,1.0,.75],
 [16.0,1470,520,1.08,.8],
 [22.0,1500,540,1.0,.6],
 [24.0,3000,540,1.0,.75],
 [29.45,4280,520,1.3,.75],
 [31.5,4640,520,.95,.9],
 [35.25,6000,520,1.0,.75],
 [38.1,7500,540,1.0,.75],
 [41.75,9000,540,1.0,.75],
 [49.45,10500,520,1.0,.75],
 [51.25,12000,540,1.0,.75],
 [53.95,13500,540,1.0,.75],
 [56.2,15000,540,1.0,.75],
 [62.65,16500,540,1.0,.8],
 [67.45,18000,540,1.0,.75],
 [72.75,19500,540,1.0,.6],
];
function cam(t){
  let cur=[CAM[0][1],CAM[0][2],CAM[0][3]];
  for(let i=1;i<CAM.length;i++){const k=CAM[i];if(t<k[0])break;const p=eio(seg(t,k[0],k[0]+k[4]));
    cur=[lerp(cur[0],k[1],p),lerp(cur[1],k[2],p),lerp(cur[2],k[3],p)];}
  // slow drift
  cur[0]+=Math.sin(t*.35)*8; cur[1]+=Math.sin(t*.27+1)*5; cur[2]*=1+0.012*Math.sin(t*.22);
  // punches
  for(const [pt,amt] of PUNCH){const q=t-pt;if(q>=0&&q<.5)cur[2]*=1+amt*Math.sin(Math.PI*q/.5)*(1-q/.5)}
  return cur;
}
const PUNCH=[[3.92,.05],[10.16,.05],[22.6,.04],[33.84,.03],[37.0,.04],[43.12,.04],[50.24,.05],[52.4,.05],[55.28,.04],[61.68,.05],[63.68,.04],[70.0,.03],[72.0,.03],[74.1,.04]];
let SHAKE=[[22.6,.35,6],[37.0,.3,5],[61.7,.6,7],[65.9,.4,5]];

// ---------- titles ----------
const TITLES=[
 [0.14,'E SE VOCÊ ACORDASSE AMANHÃ'],
 [2.24,'COM TODO O CONHECIMENTO','DO NIKOLA TESLA',3.9],
 [5.79,'MESMA CASA'],[6.88,'MESMO CELULAR'],[8.16,'MESMA CONTA NO BANCO'],
 [9.92,'SÓ A CABEÇA MUDOU'],
 [11.76,'A PRIMEIRA COISA'],
 [12.92,'VOCÊ PARA DE GASTAR','TESTANDO IDEIA',14.64],
 [16.0,'ELE MONTAVA A MÁQUINA','INTEIRA NA CABEÇA',17.48],
 [18.92,'LIGAVA'],[19.6,'CONSERTAVA'],[20.72,'VIA ONDE IA QUEBRAR'],
 [22.04,'E SÓ DEPOIS CONSTRUÍA'],
 [24.16,'A SEGUNDA'],
 [25.08,'PARA DE PENSAR EM PRODUTO'],[27.3,'E COMEÇA A PENSAR EM SISTEMA'],
 [29.6,'ELE NÃO INVENTOU SÓ UM MOTOR'],
 [31.6,'CRIOU O JEITO QUE A ENERGIA','CHEGA NA SUA CASA',33.84],
 [35.42,'A TOMADA DO SEU QUARTO','AINDA USA ESSA IDEIA',36.56],
 [38.32,'A TERCEIRA'],
 [39.4,'VOCÊ IA ENXERGAR O FUTURO'],
 [41.92,'EM 1926'],
 [43.76,'ELE DISSE QUE A GENTE IA','CARREGAR NO BOLSO',44.8],
 [45.84,'UM APARELHO PRA FALAR E SE VER','DE QUALQUER LUGAR DO MUNDO',47.76],
 [49.66,'TÁ NA SUA MÃO AGORA'],
 [51.3,''],
 [54.08,'CERCA DE 300 PATENTES'],
 [56.4,'E MORREU EM 1943'],
 [59.16,'SOZINHO, NUM QUARTO DE HOTEL'],
 [61.28,'CHEIO DE DÍVIDAS'],
 [62.88,'A MENTE MAIS BRILHANTE','DA ÉPOCA',64.4],
 [65.23,'NÃO SABIA PROTEGER','O QUE CRIAVA',66.28],
 [67.66,'ENTÃO ME DIZ'],
 [68.64,'VOCÊ IA QUERER...'],
 [72.93,'COMENTA AÍ'],[73.52,'E ME SEGUE'],
];
function typed(str,t0,t,cps=42){if(t<t0)return '';const n=Math.floor((t-t0)*cps)+1;return str.slice(0,n)}
function titleLayer(t){
  let cur=null;for(const x of TITLES){if(t>=x[0])cur=x}
  if(!cur||!cur[1])return '';
  const main=typed(cur[1],cur[0],t);
  let h=T(540,250,main,36,{w:900,ls:4});
  if(cur[2]){const sub=typed(cur[2],cur[3],t,50);h+=T(540,294,sub,22,{w:700,col:'#C8C8C8',ls:5})}
  return h;
}

// ---------- scenes ----------
function sceneA(t){ // x ~0..700
  let h='';
  // alarm clock
  const ring=t<1.5?Math.sin(t*60)*6*(1-t/1.5):0;
  h+=g(-330,FY,1,1-0.6*seg(t,5.4,6),`<path d="M0 0 L0 -86" ${LS} stroke-width="4"/><g transform="translate(0 -112) rotate(${ring})"><circle r="26" fill="#050505" ${LS} stroke-width="4"/><path d="M0 0 L0 -14 M0 0 L10 6" ${LS} stroke-width="4"/>${t<1.5?`<path d="M-30 -24 L-40 -34 M30 -24 L40 -34 M-36 -6 L-48 -8 M36 -6 L48 -8" ${LS} stroke-width="4"/>`:''}</g>`,'filter="url(#tg)"');
  // bed
  h+=g(0,0,1,1-0.6*seg(t,5.4,6),`<path d="M-240 ${FY} L-240 ${FY-120} M-240 ${FY-60} L80 ${FY-60} L80 ${FY-34} L-240 ${FY-34} M80 ${FY-34} L80 ${FY} M-200 ${FY-34} L-200 ${FY}" ${LS} stroke-width="4"/><rect x="-226" y="${FY-80}" width="56" height="20" rx="7" ${LS} stroke-width="4"/>`,'filter="url(#tg)"');
  // zzz
  if(t<1.3){for(let i=0;i<3;i++){const k=(t*0.9+i/3)%1;h+=T(-110+k*40,FY-120-k*70,'z',22-i*3,{op:(1-k)*(1-seg(t,1,1.3))})}}
  // person: lying -> standing
  const p=eio(seg(t,1.36,2.05));
  const px=lerp(70,170,p), py=lerp(FY-64,FY,p), rot=lerp(-90,0,p);
  const bolts=ease(seg(t,3.9,4.6));
  const hring=ease(seg(t,9.92,10.5));
  h+=person(px,py,t,{rot,bolts,ring:hring,still:p<1});
  // head glow pulse at "mudou"
  if(t>9.92){const q=.5+.5*Math.sin((t-9.92)*5);h+=`<circle cx="170" cy="${FY-160}" r="${60+12*q}" fill="#fff" opacity="${(.10+.10*q)*ease(seg(t,9.92,10.4))}" filter="url(#big)"/>`}
  // icons
  const fadeI=t>9.85?1-ease(seg(t,9.85,10.3)):1;
  const ic=[[5.79,360,I.house,'MESMA','CASA'],[6.88,520,(p)=>I.phone(p,''),'MESMO','CELULAR'],[8.16,680,I.bank,'MESMA','CONTA']];
  for(const [a,x,f,sm,bg] of ic){if(t<a)continue;const q=seg(t,a,a+.55);const [o,s]=ap(t,a);
    h+=g(x,470,.9+.1*s,o*fadeI,f(q),'filter="url(#tg)"')+label(x,560,sm,bg,o*fadeI*ease(seg(t,a+.2,a+.6)));}
  return h;
}
function sceneB(t){ // center 1500
  let h='';const X=1500;
  h+=person(1290,FY,t,{bolts:1});
  // prototypes with coins 12.92-15.9
  const bx=[1480,1630,1780],bt=[13.5,14.24,15.0];
  for(let i=0;i<3;i++){const a=bt[i];if(t<a-.5)continue;
    const fade=1-ease(seg(t,15.9,16.3));
    // coin arc
    const cp=seg(t,a-.5,a);if(cp<1){const cx=lerp(1335,bx[i],cp),cy=FY-150-Math.sin(cp*Math.PI)*120+cp*60;h+=g(cx,cy,.9,fade,I.coin(1),'filter="url(#tg)"')}
    const [o,s]=ap(t,a);
    const broke=t>a+.35;
    h+=g(bx[i],FY-50,.75*s,o*fade*(broke?.45:1),I.machine(1,t*90),'filter="url(#tg)"');
    if(broke){const [o2,s2]=ap(t,a+.35);h+=g(bx[i]+50,FY-150,.9*s2,o2*fade,I.x(1),'filter="url(#tg)"')}
  }
  // thought bubble 16.0-22.4
  const bo=ease(seg(t,16.0,16.5))*(1-ease(seg(t,22.1,22.5)));
  if(bo>0){
    const BX=1500,BY=470;
    h+=g(BX,BY,.9+.1*back(seg(t,16,16.5)),bo,I.bubbleT(360,240,ease(seg(t,16,16.6)))+`<circle cx="-150" cy="150" r="16" ${LS} stroke-width="4"/><circle cx="-178" cy="190" r="9" ${LS} stroke-width="4"/>`,'filter="url(#tg)"');
    const mp=seg(t,16.6,18.8);
    const spin=t>18.92?(t-18.92)*240:0;
    let crack='';
    if(t>20.72&&t<21.7){crack=`<path d="M-30 -40 L-18 -10 L-34 8 L-20 40" ${LS} stroke-width="4"/>`}
    const shake=(t>20.72&&t<21.5)?Math.sin(t*70)*4:0;
    h+=g(BX+shake,BY+8,.95,bo,I.machine(mp,spin)+crack,'filter="url(#tg)"');
    if(t>18.92&&t<19.6){for(let i=0;i<4;i++){const a=i*1.57+t*3;h+=g(BX+120+Math.cos(a)*18,BY-60+Math.sin(a)*18,1,bo*.8,`<path d="M0 -8 L0 8 M-8 0 L8 0" ${LS} stroke-width="3"/>`,'filter="url(#tg)"')}}
    if(t>19.6&&t<20.75){const sw=Math.sin((t-19.6)*12)*25;h+=g(BX+150,BY+40,.8,bo*ease(seg(t,19.6,19.85)),`<g transform="rotate(${sw})">${I.wrench()}</g>`,'filter="url(#tg)"')}
    if(t>20.72){const ok=t>21.55;const [o,s]=ap(t,ok?21.55:20.72,ok?1e9:21.5);h+=g(BX+130,BY-80,s,o*bo,ok?I.check(1.1):I.x(1.1),'filter="url(#tg)"')}
  }
  // machine falls to the floor 22.04
  if(t>22.04){const p=seg(t,22.04,22.6);const y=p<1?lerp(420,FY-50,p*p):FY-50-Math.abs(Math.sin((t-22.6)*9))*18*Math.exp(-(t-22.6)*5);
    const s=lerp(.95,1.2,ease(seg(t,22.04,22.6)));
    h+=g(1610,y,s,1,I.machine(1,(t-22)*120),'filter="url(#tg)"');
    if(t>23.0){const [o,sc]=ap(t,23.0);h+=g(1610,FY-200,sc,o,I.check(1.2),'filter="url(#tg)"')}
    h+=`<ellipse cx="1610" cy="${FY+4}" rx="${110}" ry="8" fill="#fff" opacity=".08" filter="url(#tg)"/>`;
  }
  return h;
}
function sceneC(t){ // 3000
