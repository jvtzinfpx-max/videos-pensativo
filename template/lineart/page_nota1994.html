<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#050505}
svg{position:absolute;inset:0}
text{font-family:Montserrat,sans-serif}
</style></head>
<body>
<svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<script>
// ---------- utils ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const FY=780;
// appear/disappear: returns [opacity, scale]
function ap(t,a,b=1e9,din=.38,dout=.3){
  if(t<a||t>b+dout)return [0,0];
  if(t<b){const p=seg(t,a,a+din);return [ease(p*1.6),back(p)]}
  const q=seg(t,b,b+dout);return [1-q,1-.15*q];
}
const W='#FFFFFF';
const LS=`stroke="${W}" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"`;
function g(x,y,s,o,inner,extra=''){if(o<=0.001||s<=0.001)return '';return `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(4)})" opacity="${clamp(o).toFixed(3)}" ${extra}>${inner}</g>`}
function T(x,y,str,size,{w=800,col=W,ls=3,anchor='middle',op=1,filt='tg'}={}){return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" fill="${col}" letter-spacing="${ls}" text-anchor="${anchor}" opacity="${op}" ${filt?`filter="url(#${filt})"`:''}>${str}</text>`}
// line-draw path (pathLength=1)
function P(d,p=1,sw=5,extra=''){if(p<=0)return '';return `<path d="${d}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1-clamp(p)).toFixed(4)}" stroke="${W}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`}

// ---------- icons (centered at 0,0, ~100px) ----------
const I={
 house:(p=1)=>P('M-50 0 L0 -44 L50 0',p)+P('M-38 -10 L-38 44 L38 44 L38 -10',p)+P('M-10 44 L-10 16 L10 16 L10 44',p),
 phone:(p=1,inner='')=>P('M-32 -54 Q-32 -60 -26 -60 L26 -60 Q32 -60 32 -54 L32 54 Q32 60 26 60 L-26 60 Q-32 60 -32 54 Z',p)+P('M-10 -50 L10 -50',p,4)+inner,
 bank:(p=1)=>P('M-54 -18 L0 -50 L54 -18 Z',p)+P('M-38 -8 L-38 34 M-13 -8 L-13 34 M13 -8 L13 34 M38 -8 L38 34',p)+P('M-56 46 L56 46',p),
 bolt:(s=1,fill=W)=>`<path d="M4 -26 L-12 4 L0 4 L-4 26 L12 -4 L0 -4 Z" transform="scale(${s})" fill="${fill}" stroke="${W}" stroke-width="2" stroke-linejoin="round"/>`,
 gear:(r=22,rot=0,teeth=8)=>{let d='';for(let i=0;i<teeth;i++){const a=(i/teeth)*Math.PI*2;d+=`M${(Math.cos(a)*r).toFixed(1)} ${(Math.sin(a)*r).toFixed(1)} L${(Math.cos(a)*(r+9)).toFixed(1)} ${(Math.sin(a)*(r+9)).toFixed(1)} `}
   return `<g transform="rotate(${rot})"><circle r="${r}" ${LS} stroke-width="4"/><circle r="${r*.35}" ${LS} stroke-width="4"/><path d="${d}" ${LS} stroke-width="6"/></g>`},
 machine:(p=1,rot=0)=>P('M-90 50 L-90 -40 L90 -40 L90 50 Z',p)+P('M40 -40 L40 -90 L62 -90 L62 -40',p)+P('M90 0 L120 0 L120 20 L90 20',p)+
   (p>.6?`<g opacity="${seg(p,.6,1)}"><g transform="translate(-40 6)">${I.gear(24,rot)}</g><g transform="translate(14 14)">${I.gear(15,-rot*1.6,7)}</g></g>`:''),
 check:(s=1)=>`<g transform="scale(${s})"><circle r="24" fill="#050505" ${LS} stroke-width="4"/><path d="M-11 1 L-3 9 L12 -8" ${LS} stroke-width="5"/></g>`,
 x:(s=1)=>`<g transform="scale(${s})"><circle r="24" fill="#050505" ${LS} stroke-width="4"/><path d="M-9 -9 L9 9 M9 -9 L-9 9" ${LS} stroke-width="5"/></g>`,
 coin:(s=1)=>`<g transform="scale(${s})"><circle r="20" fill="#050505" ${LS} stroke-width="4"/>${T(0,9,'$',24,{w:900,ls:0,filt:''})}</g>`,
 bubbleT:(w,h,p=1)=>P(`M${-w/2+30} ${-h/2} L${w/2-30} ${-h/2} Q${w/2} ${-h/2} ${w/2} ${-h/2+30} L${w/2} ${h/2-30} Q${w/2} ${h/2} ${w/2-30} ${h/2} L${-w/2+30} ${h/2} Q${-w/2} ${h/2} ${-w/2} ${h/2-30} L${-w/2} ${-h/2+30} Q${-w/2} ${-h/2} ${-w/2+30} ${-h/2} Z`,p),
 bulb:(p=1)=>P('M-26 22 Q-50 0 -46 -30 Q-40 -70 0 -72 Q40 -70 46 -30 Q50 0 26 22 Z',p)+P('M-20 34 L20 34 M-14 46 L14 46',p)+P('M-12 10 L-6 -22 L0 -6 L6 -22 L12 10',p,4),
 eye:(o=1)=>`<path d="M-70 0 Q0 ${-56*o} 70 0 Q0 ${56*o} -70 0 Z" ${LS}/><circle r="${20*o}" fill="${W}"/>`,
 tower:(p=1)=>P('M-26 0 L-8 -150 L8 -150 L26 0 M-17 -70 L17 -70 M-12 -110 L12 -110 M-40 -130 L40 -130',p),
 plant:(p=1,rot=0)=>P('M-110 0 L-110 -120 L60 -120 L60 0',p)+P('M10 -120 L10 -190 L36 -190 L36 -120',p)+(p>.5?`<g transform="translate(-40 -60)" opacity="${seg(p,.5,1)}">${I.gear(26,rot)}</g>`:''),
 houseS:(lit=0,p=1)=>P('M-40 0 L-40 -60 L0 -92 L40 -60 L40 0',p)+`<rect x="-14" y="-52" width="28" height="24" rx="3" fill="${lit>0?W:'none'}" fill-opacity="${lit}" ${LS} stroke-width="4" opacity="${p>.7?1:0}"/>`,
 outlet:(p=1)=>P('M-110 -130 L110 -130 Q130 -130 130 -110 L130 110 Q130 130 110 130 L-110 130 Q-130 130 -130 110 L-130 -110 Q-130 -130 -110 -130 Z',p,6)+P('M0 -88 A88 88 0 1 1 -0.1 -88',p,5)+(p>.7?`<g opacity="${seg(p,.7,1)}"><circle cx="-32" cy="0" r="13" ${LS}/><circle cx="32" cy="0" r="13" ${LS}/><circle cx="0" cy="42" r="11" ${LS}/></g>`:''),
 globe:(rot=0)=>{const k=Math.sin(rot);return `<circle r="60" ${LS}/><ellipse rx="${Math.abs(26*Math.cos(rot))+4}" ry="60" ${LS} stroke-width="4"/><path d="M-60 0 L60 0 M-52 -30 L52 -30 M-52 30 L52 30" ${LS} stroke-width="4"/>`},
 doc:(s=1)=>`<g transform="scale(${s})"><path d="M-22 -30 L10 -30 L22 -18 L22 30 L-22 30 Z" fill="#050505" ${LS} stroke-width="4"/><path d="M-12 -12 L12 -12 M-12 0 L12 0 M-12 12 L4 12" ${LS} stroke-width="3"/></g>`,
 bill:(s=1)=>`<g transform="scale(${s})"><rect x="-38" y="-22" width="76" height="44" rx="5" fill="#050505" ${LS} stroke-width="4"/>${T(0,9,'−$',22,{w:900,ls:0,filt:''})}</g>`,
 shield:(p=1)=>P('M0 -70 L56 -48 Q56 30 0 70 Q-56 30 -56 -48 Z',p),
 calendar:(txt,sub='ANO')=>`<rect x="-80" y="-70" width="160" height="150" rx="18" fill="#050505" ${LS}/><path d="M-80 -24 L80 -24" ${LS} stroke-width="4"/><path d="M-40 -84 L-40 -58 M40 -84 L40 -58" ${LS} stroke-width="6"/>${T(0,-36,sub,18,{ls:4,filt:''})}${T(0,42,txt,50,{w:900,ls:1,filt:''})}`,
 wrench:()=>`<path d="M-40 40 L10 -10 M10 -10 A22 22 0 1 0 30 -34 L18 -22 L8 -26 L4 -36 L16 -48" ${LS} stroke-width="7"/>`,
 pill:(txt,{fill=false,size=22,pad=26}={})=>{const w=txt.length*size*.78+pad*2;return `<rect x="${-w/2}" y="-24" width="${w}" height="48" rx="24" fill="${fill?W:'#050505'}" stroke="${W}" stroke-width="4"/>${T(0,size*.36,txt,size,{w:800,col:fill?'#050505':W,ls:2,filt:''})}`},
 dpill:(txt,size=24)=>{const w=txt.length*size*.8+56;return `<rect x="${-w/2}" y="-26" width="${w}" height="52" rx="12" fill="#050505" stroke="${W}" stroke-width="4" stroke-dasharray="10 8"/>${T(0,size*.36,txt,size,{w:900,ls:3,filt:''})}`},
 tie:()=>`<path d="M-7 -118 L7 -118 L4 -110 L10 -76 L0 -66 L-10 -76 L-4 -110 Z" fill="#050505"/>`,
};
function label(x,y,small,big,o=1){return g(x,y,1,o,(small?T(0,0,small,15,{w:700,col:'#A8A8A8',ls:5,filt:''}):'')+T(0,small?28:0,big,20,{w:800,ls:5}))}

// ---------- character ----------
// feet at (x,y). opts: s, dim(0..1), tie, rot, bolts(0..1), ring, glowK
function person(x,y,t,o={}){
  const s=o.s||1,dim=o.dim||0,rot=o.rot||0;
  const br=o.still?0:Math.sin(t*2.2+(o.ph||0));
  const sy=(1+0.012*br)*(o.sq||1), hy=-2*br+(1-(o.sq||1))*120;
  const op=1-0.55*dim;
  const fil=dim>.5?'fD':'fP';
  let body=`<path d="M-40 0 L-40 -82 A40 40 0 0 1 40 -82 L40 0 Z" fill="${W}" transform="scale(1 ${sy})"/>`;
  let head=`<circle cx="0" cy="${-160+hy+(o.headDY||0)}" r="31" fill="${W}"/>`;
  let extra='';
  if(o.tie) extra+=I.tie();
  if(o.sash) extra+=`<path d="M-40 -74 L40 -22 L40 -6 L-40 -58 Z" fill="#050505"/><circle cx="18" cy="-30" r="7" fill="#050505"/>`;
  let inner=`<g filter="url(#${fil})">${body}${head}</g>${extra}`;
  if(o.ring){const q=o.ring;extra='';inner+=`<circle cy="${-160+hy}" r="${44}" ${LS} stroke-width="4" opacity="${q}" filter="url(#tg)"/>`}
  if(o.bolts){const n=5;for(let i=0;i<n;i++){const a=t*1.6+i*Math.PI*2/n;const bx=Math.cos(a)*78,by=-160+hy+Math.sin(a)*30;const z=Math.sin(a)>0?1:.75;
      inner+=`<g transform="translate(${bx.toFixed(1)} ${(by-6).toFixed(1)}) scale(${(.55*z*o.bolts).toFixed(3)})" opacity="${o.bolts}" filter="url(#tg)">${I.bolt(1)}</g>`}}
  if(o.dollars){const n=5;for(let i=0;i<n;i++){const a=-t*1.3+i*Math.PI*2/n;const bx=Math.cos(a)*74,by=-160+hy+Math.sin(a)*28;
      inner+=T(bx.toFixed(1),(by+9).toFixed(1),'$',30,{w:900,ls:0,op:o.dollars})}}
  const sh=`<ellipse cx="0" cy="4" rx="${48}" ry="7" fill="#fff" opacity="${.10*(1-dim)}" filter="url(#tg)"/>`;
  return `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot}) scale(${s})" opacity="${(op*(o.op===undefined?1:o.op)).toFixed(3)}">${rot===0?sh:''}${inner}</g>`;
}

// ================= NOTA DE 100 DE 1994 =================
const GF='filter="url(#tg)"';
let CAMX=0;
// parallax background layer (dim, thinner lines)
function BG(X,o,inner){return `<g transform="translate(${((CAMX-X)*0.35).toFixed(1)} 0)" opacity="${(0.42*o).toFixed(3)}" ${GF}>${inner}</g>`}
const LT=`stroke="${W}" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
function line(d,w=3){return `<path d="${d}" ${LT} stroke-width="${w}"/>`}

// ---------- new icons ----------
I.note100=(s=1,shine=-1)=>{let h=`<g transform="scale(${s})"><rect x="-110" y="-55" width="220" height="110" rx="10" fill="#050505" ${LS}/><rect x="-96" y="-41" width="192" height="82" rx="6" ${LS} stroke-width="2.5"/>`+
  T(-60,14,'R$',26,{w:900,ls:0,filt:''})+T(52,22,'100',48,{w:900,ls:1,filt:''})+`<path d="M-80 32 Q-40 18 0 32 T80 32" ${LS} stroke-width="2.5"/>`+
  `<path d="M-10 -30 Q8 -42 22 -30 Q8 -18 -10 -30 Z M22 -30 L32 -36 L32 -24 Z" ${LS} stroke-width="2.5"/>`;
  if(shine>=0&&shine<=1){const x=-130+shine*260;h+=`<path d="M${x} -55 L${x+30} -55 L${x-10} 55 L${x-40} 55 Z" fill="#fff" opacity=".55" clip-path="url(#noteclip)"/>`}
  return h+'</g>'};
I.cart=(items=0)=>{let h=`<path d="M-110 -110 L-80 -110 L-55 0 L70 0 L95 -80 L-70 -80" ${LS}/><circle cx="-40" cy="22" r="12" ${LS}/><circle cx="55" cy="22" r="12" ${LS}/>`;
  const boxes=[[-50,-80,30,40],[-14,-80,26,55],[16,-80,34,30],[54,-80,24,46],[-34,-120,30,40],[4,-135,22,55]];
  boxes.forEach((b,i)=>{const k=clamp(items*boxes.length-i);if(k<=0)return;const yo=(1-ease(k))*-160;h+=`<rect x="${b[0]}" y="${b[1]-b[3]+yo}" width="${b[2]}" height="${b[3]}" rx="4" fill="#050505" ${LS} stroke-width="3.5" opacity="${ease(k*2)}"/>`});return h};
I.basket=()=>`<path d="M-50 -40 L50 -40 L38 10 L-38 10 Z" fill="#050505" ${LS}/><path d="M-30 -40 Q0 -90 30 -40" ${LS}/><path d="M-30 -24 L30 -24 M-25 -8 L25 -8 M-15 -40 L-10 10 M15 -40 L10 10" ${LS} stroke-width="3"/>`;
I.bread=()=>`<path d="M-70 0 Q-70 -40 0 -40 Q70 -40 70 0 Q70 18 0 18 Q-70 18 -70 0 Z" fill="#050505" ${LS}/><path d="M-36 -24 L-24 -4 M-8 -28 L4 -6 M20 -26 L32 -6" ${LS} stroke-width="4"/>`;
I.tag=(txt)=>`<path d="M0 0 L0 -22" ${LS} stroke-width="3"/><path d="M-60 -22 L60 -22 L60 -70 L-60 -70 Z" fill="#050505" ${LS} stroke-width="4"/><circle cx="0" cy="-60" r="4" fill="${W}"/>`+T(0,-34,txt,24,{w:900,ls:1,filt:''});
I.pump=(val)=>`<rect x="-55" y="-200" width="110" height="200" rx="10" fill="#050505" ${LS}/><rect x="-38" y="-178" width="76" height="46" rx="5" ${LS} stroke-width="4"/>`+T(0,-146,val,22,{w:900,ls:0,filt:''})+
  `<path d="M55 -110 L80 -110 L80 -40 Q80 -20 95 -20 L95 -80" ${LS}/><rect x="84" y="-100" width="22" height="30" rx="4" ${LS} stroke-width="4"/><path d="M-30 -100 L30 -100 M-30 -80 L30 -80" ${LS} stroke-width="3"/>`;
I.car=()=>`<path d="M-120 0 L-120 -40 L-80 -46 L-50 -86 L40 -86 L80 -46 L120 -40 L120 0 Z" fill="#050505" ${LS}/><path d="M-40 -78 L-10 -78 L-10 -48 L-66 -48 Z M2 -78 L34 -78 L64 -48 L2 -48 Z" ${LS} stroke-width="3"/><circle cx="-70" cy="2" r="20" fill="#050505" ${LS}/><circle cx="70" cy="2" r="20" fill="#050505" ${LS}/>`;
I.scale=(tilt=0)=>`<path d="M0 0 L0 -180 M-40 0 L40 0" ${LS}/><g transform="translate(0 -180) rotate(${tilt})"><path d="M-130 0 L130 0" ${LS}/><path d="M-130 0 L-160 60 M-130 0 L-100 60 M-170 60 L-90 60" ${LS} stroke-width="3"/><path d="M130 0 L100 60 M130 0 L160 60 M90 60 L170 60" ${LS} stroke-width="3"/></g><circle cy="-180" r="8" fill="${W}"/>`;
I.salaryCard=(frac=1)=>`<rect x="-55" y="-18" width="${110*frac}" height="36" rx="6" fill="#050505" ${LS} stroke-width="3.5"/>`+(frac>.9?T(0,7,'SALÁRIO',14,{w:900,ls:1,filt:''}):T(-55+55*frac,7,'½',18,{w:900,ls:0,filt:''}));
I.can=()=>`<rect x="-30" y="-80" width="60" height="80" rx="6" fill="#050505" ${LS} stroke-width="4"/><path d="M-30 -66 L30 -66 M-30 -14 L30 -14" ${LS} stroke-width="3"/>`;
I.gun=(press=0)=>`<g transform="rotate(${-10+press*14})"><path d="M-70 -30 L50 -30 Q70 -30 70 -10 L70 10 L-30 10 L-40 60 L-70 60 L-60 10 L-70 10 Z" fill="#050505" ${LS}/><circle cx="20" cy="-30" r="22" fill="#050505" ${LS} stroke-width="4"/><circle cx="20" cy="-30" r="8" ${LS} stroke-width="3"/><path d="M-30 18 Q-20 40 -34 46" ${LS} stroke-width="4"/><path d="M70 0 L92 0" ${LS} stroke-width="6"/></g>`;
I.chartUp=(k=1)=>{const pts=[[0,0],[40,-6],[80,-18],[120,-50],[150,-110],[170,-220]];let d=`M${pts[0][0]} ${pts[0][1]}`;const n=Math.max(1,Math.floor(k*(pts.length-1)));for(let i=1;i<=n;i++)d+=` L${pts[i][0]} ${pts[i][1]}`;
  return `<path d="M-10 10 L190 10 M-10 10 L-10 -240" ${LS} stroke-width="3"/><path d="${d}" ${LS} stroke-width="6"/>`};
I.mattress=(lift=0)=>`<g transform="translate(-140 0) rotate(${-lift*28}) translate(140 0)"><rect x="-140" y="-34" width="280" height="30" rx="12" fill="#050505" ${LS}/></g>`;
I.bedFrame=()=>`<path d="M-160 0 L-160 -110 Q-160 -130 -140 -130 L-140 -4 M-160 -4 L160 -4 L160 -40 M-150 0 L-150 6 M150 0 L150 6" ${LS} stroke-width="4"/>`;
I.lupa=()=>`<circle r="70" ${LS} stroke-width="7"/><path d="M50 50 L120 120" ${LS} stroke-width="14"/>`;
I.piggy=()=>`<ellipse cx="0" cy="-40" rx="70" ry="48" fill="#050505" ${LS}/><circle cx="64" cy="-46" r="16" ${LS} stroke-width="4"/><circle cx="68" cy="-48" r="2.5" fill="${W}"/><circle cx="72" cy="-43" r="2.5" fill="${W}"/><path d="M-20 -90 L10 -90" ${LS} stroke-width="5"/><path d="M-40 4 L-40 14 M30 4 L30 14" ${LS} stroke-width="8"/><path d="M-70 -46 Q-90 -60 -80 -70" ${LS} stroke-width="4"/><circle cx="34" cy="-56" r="3.5" fill="${W}"/>`;
I.bags=()=>`<path d="M-60 0 L-50 -80 L10 -80 L20 0 Z" fill="#050505" ${LS}/><path d="M-36 -80 Q-20 -110 -4 -80" ${LS} stroke-width="4"/><path d="M0 0 L8 -60 L60 -60 L66 0 Z" fill="#050505" ${LS}/><path d="M20 -60 Q34 -84 48 -60" ${LS} stroke-width="4"/>`;
I.crt=()=>`<rect x="-70" y="-120" width="140" height="110" rx="12" ${LT}/><rect x="-56" y="-108" width="96" height="84" rx="16" ${LT}/><circle cx="56" cy="-90" r="5" ${LT}/><path d="M-20 -120 L-40 -160 M20 -120 L40 -160" ${LT}/><path d="M-80 -10 L80 -10 L80 0 L-80 0" ${LT}/>`;
I.flat=()=>`<rect x="-110" y="-150" width="220" height="125" rx="5" ${LT}/><path d="M0 -25 L0 -10 M-30 -10 L30 -10" ${LT}/>`;
I.landline=()=>`<path d="M-30 0 L-22 -28 L22 -28 L30 0 Z" ${LT}/><path d="M-34 -34 Q0 -50 34 -34" ${LT} stroke-width="7"/><path d="M30 -8 Q50 -6 46 10 Q42 24 60 22" ${LT}/>`;
I.smart=()=>`<rect x="-14" y="-36" width="28" height="36" rx="4" ${LT}/><path d="M-6 -32 L6 -32" ${LT}/>`;

// ---------- environments ----------
function room(X,t,{night=false,modern=false,cal='1994',timelapse=0}={}){
  let h='';
  // window
  h+=line(`M${X-380} 260 L${X-200} 260 L${X-200} 450 L${X-380} 450 Z M${X-290} 260 L${X-290} 450 M${X-380} 355 L${X-200} 355`,4);
  if(timelapse>0){const ph=(timelapse*6)%1;const sx=X-290+Math.cos(ph*Math.PI)*-70, sy=430-Math.sin(ph*Math.PI)*140;h+=`<circle cx="${sx}" cy="${sy}" r="14" ${LT}/>`}
  else if(night)h+=`<path d="M${X-245} 300 A16 16 0 1 0 ${X-245} 332 A12 12 0 1 1 ${X-245} 300 Z" fill="${W}"/>`;
  else{const sy=lerp(440,300,ease(seg(t,0.4,2.6)));h+=`<circle cx="${X-330}" cy="${sy}" r="16" ${LT}/>`+[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3+t*.5;return line(`M${X-330+Math.cos(a)*24} ${sy+Math.sin(a)*24} L${X-330+Math.cos(a)*34} ${sy+Math.sin(a)*34}`,2.5)}).join('')}
  if(modern){for(let i=0;i<5;i++){const bx=X-372+i*34,bh=40+((i*37)%60);h+=line(`M${bx} 450 L${bx} ${450-bh} L${bx+26} ${450-bh} L${bx+26} 450`,2.5);if(Math.sin(t*2+i*3)>0)h+=`<rect x="${bx+9}" y="${450-bh+10}" width="7" height="7" fill="${W}"/>`}}
  // pendant lamp
  const sw=Math.sin(t*1.3)*3;h+=`<g transform="rotate(${sw} ${X+40} 90)">${line(`M${X+40} 90 L${X+40} 170 M${X+10} 200 L${X+40} 170 L${X+70} 200 Z`,3)}</g>`;
  // picture frame
  h+=line(`M${X+150} 250 L${X+250} 250 L${X+250} 330 L${X+150} 330 Z M${X+162} 318 L${X+190} 282 L${X+212} 306 L${X+226} 290 L${X+240} 318`,3);
  // nightstand + phone
  h+=line(`M${X-200} ${FY} L${X-200} ${FY-90} L${X-120} ${FY-90} L${X-120} ${FY} M${X-200} ${FY-50} L${X-120} ${FY-50}`,3);
  h+=`<g transform="translate(${X-160} ${FY-90})">${modern?I.smart():I.landline()}</g>`;
  // TV
  h+=`<g transform="translate(${X+330} ${modern?FY-200:FY-80})">${modern?I.flat():I.crt()}</g>`;
