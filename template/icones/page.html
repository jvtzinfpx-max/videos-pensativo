<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;src:url(fonts/Poppins-Bold.ttf);font-weight:700 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Poppins,Inter,Arial,sans-serif}

<body><div id="stage"></div><div id="title"></div><div id="type"></div><div id="hook"></div><div id="caps"></div><div id="cards"></div><div id="flash"></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as E from './engine.js';
import * as I from './icons.js';
const { THREE } = E;
Object.assign(E.BLOOM, { s: 0.32, r: 0.08, th: 0.55, crisp: true }); // glow em volta + ícone nítido por cima
await E.loadFont(); await document.fonts.load('900 100px Poppins');

window.WORDS = window.WORDS || 'O celular virou a maior loja do país hoje são milhões de sites e apps vendendo a cada segundo uma nova venda aprovada e o faturamento não para de crescer tanto que até as escolas já ensinam isso'.split(' ').map((w, i) => ({ w, s: 0.2 + i * 0.4, e: 0.2 + i * 0.4 + 0.34 }));
function world() { const s = new THREE.Scene(); s.background = new THREE.Color(0x000000); const l = new THREE.DirectionalLight(0xffffff, 2); l.position.set(2, 3, 6); s.add(l, new THREE.AmbientLight(0xffffff, .6)); return s; }
// entrada de cada plano: ícone nasce menor e cresce (zoom)
const enter = (g, t, base = 1) => { const k = E.back(E.seg(t, 0, 0.35)); g.scale.setScalar(Math.max(1e-4, base * (0.6 + 0.4 * k))); };

const SC = [];

  at(s, t) { this.ic.build(t, -0.15, 0.17); enter(this.ic.g, t, 0.95); this.ic.g.position.x = -0.15; I.sway(this.ic.g, t, 0.3, 1); I.camFront(t, -0.3, 9.2, t / 3, 1.0); },
  sfx: () => [[0.0, 'whoosh', .5], [0.05, 'pop', .7], [0.22, 'pop', .7], [0.39, 'pop', .7], [0.6, 'ticks', .4]] });
SC.push({
  build() { const s = world(); I.gridBackdrop(s); this.app = I.app3d(I.coin(), 1.5); s.add(this.app);
    this.cards = Array.from({ length: 4 }, (_, i) => { const c = I.notifCard('Nova venda aprovada!', `+ R$ ${[49, 129, 89, 230][i]},90 no Pix`, 3.0, 0.62); s.add(c); return c; }); this.refl = this.cards.map(c => { const r = I.reflect(c, 0.14); s.add(r); return r; }); return s; },
  at(s, t) { const k = E.back(E.seg(t, 0, 0.4)); this.app.scale.setScalar(Math.max(1e-4, k)); this.app.userData.inner.build(t, 0.25, 0.12);
    const up = this.cards.filter((_, i) => t > 0.7 + i * 0.5).length; this.app.position.set(0, 1.2 + up * 0.3, 0); this.app.rotation.set(0.12, Math.sin(t * .9) * .2, 0);
    this.cards.forEach((c, i) => { const t0 = 0.7 + i * 0.5, kk = E.back(E.seg(t, t0, t0 + 0.35)); c.visible = t > t0; c.scale.setScalar(Math.max(1e-4, kk)); c.position.set(0, this.app.position.y - 1.35 - i * 0.72, 0.2); c.rotation.set(-0.1, Math.sin(t * .9) * .15, 0); });
    const low = this.app.position.y - 1.35 - (up - 1) * 0.72; this.refl.forEach((r, i) => { const c = this.cards[i]; r.visible = c.visible && i >= up - 2; r.scale.set(c.scale.x, -c.scale.y, 1); r.position.set(0, 2 * (low - 0.36) - c.position.y, 0.2); r.rotation.copy(c.rotation); r.material.opacity = 0.12 * (i === up - 1 ? 1 : 0.4); });
    E.camera.position.set(Math.sin(t * .5) * .4, 0.2, 9.0 - t * 0.2); E.camera.lookAt(0, -0.35, 0); },
  sfx: () => [[0.0, 'pop'], [0.7, 'notif', .8], [1.2, 'notif', .8], [1.7, 'notif', .8], [2.2, 'notif', .8], [2.7, 'chaching', .7]] });
SC.push({
  build() { const s = world(); this.ic = I.barChart(); s.add(this.ic.g); this.ic.g.userData.y0 = 0; return s; },
  at(s, t) { this.ic.build(t, -0.15, 0.14); enter(this.ic.g, t, 0.95); I.sway(this.ic.g, t, 0.3, 2); I.camFront(t, -0.25, 9.2, t / 3, 1.0); },
  sfx: () => [[0.0, 'whoosh', .5], [0.2, 'riser2', .5], [0.9, 'sparkle', .6]] });
SC.push({
  build() { const s = world(); this.ic = I.school(); s.add(this.ic.g); this.ic.g.userData.y0 = 0; return s; },
  at(s, t) { this.ic.build(t, -0.15, 0.12); enter(this.ic.g, t, 0.9); I.sway(this.ic.g, t, 0.28, 3); I.camFront(t, -0.15, 9.2, t / 3.2, 1.0); },
  sfx: () => [[0.0, 'whoosh', .5], [0.05, 'pop'], [0.2, 'pop', .7], [0.6, 'ding', .6], [1.0, 'ticks', .4]] });

const built = {};
window.META = () => { const D = window.T.DUR; let st = [], a = 0; D.forEach(d => { st.push(a); a += d; }); const SFX = []; SC.forEach((S, i) => (S.sfx ? S.sfx() : []).forEach(([lt, n, g]) => SFX.push([st[i] + lt, n, g ?? 1]))); return { DUR: D, START: st, TOTAL: a, SFX }; };
window.renderAt = (si, t) => {
  const S = SC[si]; if (!built[si]) built[si] = S.build(); const s = built[si];
  S.at(s, t); E.hook(S.hook, t, 2.4); E.captions(window.META().START[si] + t);
  document.getElementById('flash').style.opacity = si > 0 ? 0.25 * (1 - E.clamp(t / 0.12)) : 0;
  E.draw(s); return true;
};
window.READY = true;
